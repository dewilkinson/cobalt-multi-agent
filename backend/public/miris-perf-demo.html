<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miris Model Viewer - Performance Profiler Overlay Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .demo-controls {
      position: absolute;
      bottom: 24px;
      left: 24px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 340px;
    }
    .demo-title {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .demo-desc {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .info-tag {
      font-size: 10px;
      color: #64748b;
      font-family: monospace;
      margin-top: 4px;
    }
  </style>

  <!-- Load Three.js library for WebGL Scene demonstration -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Load Miris Performance Overlay -->
  <script src="miris-perf-overlay.js"></script>
</head>
<body>

  <div id="canvas-container">
    <canvas id="webgl-canvas"></canvas>
  </div>

  <div class="demo-controls">
    <div class="demo-title">
      <span>🌐 MIRIS MODEL VIEWER</span>
    </div>
    <p class="demo-desc">
      Performance Overlay attached. Move object count, test draw call stress, trigger streaming API calls, and inspect the real-time profiler panel.
    </p>

    <div class="btn-group">
      <button class="btn" id="btn-add-mesh">Add 1,000 Cubes</button>
      <button class="btn btn-secondary" id="btn-stress-draw">Stress Draw Calls</button>
      <button class="btn btn-secondary" id="btn-sim-api">Simulate API Request</button>
      <button class="btn btn-secondary" id="btn-toggle-hud">Toggle HUD (Key ~)</button>
    </div>

    <div class="info-tag" id="mesh-count-tag">Active Objects: 100 Cubes</div>
  </div>

  <script>
    // --- WebGL & Three.js Demo Scene Initialization ---
    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0f19);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 15, 30);
    camera.lookAt(0, 0, 0);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // Grid Ground
    const gridHelper = new THREE.GridHelper(50, 50, 0x38bdf8, 0x1e293b);
    scene.add(gridHelper);

    // Cube instances
    const cubeGroup = new THREE.Group();
    scene.add(cubeGroup);

    const geometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
    
    function addCubes(count) {
      for (let i = 0; i < count; i++) {
        const material = new THREE.MeshStandardMaterial({
          color: Math.random() * 0xffffff,
          roughness: 0.3,
          metalness: 0.8
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(
          (Math.random() - 0.5) * 35,
          Math.random() * 15,
          (Math.random() - 0.5) * 35
        );
        mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
        cubeGroup.add(mesh);
      }
      document.getElementById('mesh-count-tag').textContent = `Active Objects: ${cubeGroup.children.length} Cubes`;
    }

    // Initial Cubes
    addCubes(100);

    // Render loop
    function animate() {
      requestAnimationFrame(animate);

      cubeGroup.rotation.y += 0.005;
      cubeGroup.children.forEach((c, idx) => {
        c.rotation.x += 0.01;
      });

      renderer.render(scene, camera);
    }
    animate();

    // Handle Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Control Listeners
    document.getElementById('btn-add-mesh').addEventListener('click', () => {
      addCubes(1000);
    });

    document.getElementById('btn-stress-draw').addEventListener('click', () => {
      addCubes(3000);
    });

    document.getElementById('btn-sim-api').addEventListener('click', () => {
      fetch('https://jsonplaceholder.typicode.com/posts/1')
        .then(res => res.json())
        .then(data => console.log('[Miris Demo API]', data))
        .catch(err => console.error(err));
    });

    document.getElementById('btn-toggle-hud').addEventListener('click', () => {
      if (window.__MIRIS_PERF_OVERLAY__) window.__MIRIS_PERF_OVERLAY__.toggle();
    });
  </script>
</body>
</html>
