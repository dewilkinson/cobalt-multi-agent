<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>VLI | Terminal Booting</title>
    <!-- Import Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(13, 17, 24, 0.75);
            --border-neon: rgba(56, 139, 253, 0.4);
            --glow-neon: rgba(56, 139, 253, 0.15);
            --text-cyan: #58a6ff;
            --text-muted: #8b949e;
            --emerald-green: #39d353;
            --amber-gold: #ffc107;
            --ruby-red: #f85149;
            --font-mono: 'Share Tech Mono', monospace;
            --font-sans: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-cyan);
            font-family: var(--font-sans);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(56, 139, 253, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 0, 139, 0.05) 0%, transparent 40%);
        }

        /* Glassmorphism boot container */
        .boot-card {
            background: var(--card-bg);
            border: 1px solid var(--border-neon);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), 0 0 20px 0 var(--glow-neon);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 40px;
            width: 600px;
            box-sizing: border-box;
            position: relative;
        }

        h2 {
            font-family: var(--font-sans);
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 24px;
            text-align: center;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Monospace terminal console */
        .terminal {
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 20px;
            height: 280px;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.6;
            color: #c9d1d9;
            text-align: left;
            box-sizing: border-box;
            margin-bottom: 30px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .log-line {
            opacity: 0;
            transform: translateY(4px);
            animation: fadeInUp 0.2s forwards;
            white-space: nowrap;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-ok {
            color: var(--emerald-green);
            font-weight: bold;
        }

        .status-warn {
            color: var(--amber-gold);
            font-weight: bold;
        }

        .status-error {
            color: var(--ruby-red);
            font-weight: bold;
        }

        .status-info {
            color: var(--text-cyan);
        }

        .status-highlight {
            color: #bc8cff;
            font-weight: bold;
        }

        /* Premium progress bar loader */
        .progress-container {
            width: 100%;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #58a6ff 0%, #388bfd 50%, #bc8cff 100%);
            border-radius: 3px;
            animation: loadProgress 4.5s linear forwards;
            box-shadow: 0 0 8px #388bfd;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .loader-glow {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 12px;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(56, 139, 253, 0.1) inset;
        }

        @keyframes pulse {
            0% { opacity: 0.6; box-shadow: 0 0 0 0 rgba(57, 211, 83, 0.2); }
            50% { opacity: 1; box-shadow: 0 0 10px 4px rgba(57, 211, 83, 0.4); }
            100% { opacity: 0.6; box-shadow: 0 0 0 0 rgba(57, 211, 83, 0.2); }
        }
    </style>
</head>
<body>
    <div class="boot-card">
        <div class="loader-glow"></div>
        <h2>VLI Core Orchestrator</h2>
        
        <div class="terminal" id="terminal">
            <div class="log-line">Initializing VLI Boot Sequence...</div>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        <div id="continue-prompt" style="display: none; margin-top: 15px; font-family: var(--font-mono); font-size: 11px; text-align: center; color: var(--text-muted); cursor: pointer; letter-spacing: 1px; text-transform: uppercase;">
            Press any key or click here to continue
        </div>
    </div>

    <script>
        const terminal = document.getElementById("terminal");

        function addLog(text, delay = 0) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    const el = document.createElement("div");
                    el.className = "log-line";
                    el.innerHTML = text;
                    terminal.appendChild(el);
                    terminal.scrollTop = terminal.scrollHeight;
                    resolve();
                }, delay);
            });
        }

        async function fetchApiStatus() {
            try {
                const response = await fetch("http://127.0.0.1:8000/api/system/api-status");
                if (response.ok) {
                    return await response.json();
                }
            } catch (e) {
                // Ignore connection errors during initial startup
            }
            return null;
        }

        async function bootSequence() {
            await addLog("<span class='status-info'>Loading configuration profiles...</span>", 400);
            await addLog("<span class='status-info'>Connecting to local Python core backend...</span>", 400);
            await addLog("<span class='status-info'>Starting 3rd party connection diagnostics...</span>", 400);

            // Poll the backend until it is alive and gives us the status payload
            let data = null;
            for (let i = 0; i < 30; i++) {
                data = await fetchApiStatus();
                if (data) break;
                await new Promise(r => setTimeout(r, 500));
            }

            if (!data) {
                await addLog("<span class='status-error'>[ ERROR ] Failed to contact VLI service backend.</span>", 200);
                return;
            }

            await addLog("<span class='status-highlight'>Core backend online! Running subscription API diagnostics...</span>", 300);

            // Sequentially print the status of each service from the JSON response
            for (const svc of data.services) {
                await addLog(`[ <span class='status-info'>CHECKING</span> ] ${svc.service}...`, 400);
                if (svc.connected) {
                    await addLog(`[ <span class='status-ok'>OK</span> ] Connected: ${svc.details}`, 150);
                } else {
                    await addLog(`[ <span class='status-warn'>WARN</span> ] Preferred key missing: Using fallback`, 150);
                    await addLog(`           Fallback path: <span class='status-warn'>${svc.fallback}</span>`, 100);
                }
            }

            await addLog("--------------------------------------------------", 300);
            await addLog("API verification complete. Core initialization finalized.", 200);
            await addLog("<span class='status-highlight'>BOOT COMPLETED. REDIRECTING TO WORKSPACE...</span>", 200);
            
            await addLog("<br><span class='status-ok'>[ CORE LOAD REPORT ]</span>", 300);
            await addLog(" * Configuration Profile Subsystem .................. [ LOADED ]", 100);
            await addLog(" * Local Python Core Service Engine ................. [ LOADED ]", 100);
            await addLog(" * Watchlist Analyzer & Scanner Module .............. [ LOADED ]", 100);
            await addLog(" * FIFO Trades Plotter Script Generator ............. [ LOADED ]", 100);
            
            // Dynamically list each third-party subscription API service status
            for (const svc of data.services) {
                let statusStr = "";
                if (svc.connected) {
                    statusStr = "<span class='status-ok'>[ LOADED ]</span>";
                } else {
                    const shortFallback = svc.fallback.split(" (")[0].split(" / ")[0];
                    statusStr = `<span class='status-warn'>[ OFFLINE -> ${shortFallback} ]</span>`;
                }
                const paddedName = svc.service.padEnd(42, '.');
                await addLog(` * ${paddedName} ${statusStr}`, 100);
            }
            
            const affectedFuncs = {
                "Google AI Studio (Gemini)": "Agent chat / reasoning, automated chart reviews, macro briefing summaries (Ollama fallback is slower)",
                "Financial Modeling Prep (FMP)": "Realtime gainers/losers/active scanners (yfinance fallback is delayed/less real-time)",
                "Alpha Vantage API": "Intraday news sentiment indexes, macroeconomic indicators",
                "Tavily Search API": "Scout agent web search & research utilities (falls back to Brave/DuckDuckGo Search)",
                "Ngrok Tunneling Service": "External TradingView alert webhooks (webhook ingestion disabled; localhost-only)"
            };
            
            let hasWarnings = false;
            for (const svc of data.services) {
                if (!svc.connected) {
                    if (!hasWarnings) {
                        await addLog("<br><span class='status-error'>[ DIAGNOSTIC WARNINGS & LOGS ]</span>", 150);
                        hasWarnings = true;
                    }
                    await addLog(` * <span class='status-warn'>${svc.service}</span>: <span class='status-error'>KEY MISSING</span>`, 100);
                    const affected = affectedFuncs[svc.service] || "None";
                    await addLog(`   <span class='status-error'>- AFFECTED:</span> <span class='status-warn'>${affected}</span>`, 100);
                }
            }

            // Display interactive press any key prompt
            setTimeout(() => {
                const promptEl = document.getElementById("continue-prompt");
                if (promptEl) {
                    promptEl.style.display = "block";
                }
                
                let navigated = false;
                
                function navigate() {
                    if (navigated) return;
                    navigated = true;
                    window.location.href = "http://127.0.0.1:8000/vli_dashboard.html";
                }
                
                window.addEventListener("keydown", navigate);
                if (promptEl) {
                    promptEl.addEventListener("click", navigate);
                }
            }, 300);
        }

        // Start boot sequence once DOM is ready
        window.addEventListener("DOMContentLoaded", bootSequence);
    </script>
</body>
</html>
